name: Publish the deb build tools

# This publishes bootc and bootupd once for each family and pin pair, so an
# image build can fetch the binaries. `deb/bootc-base` compiles them from
# source until a maintainer records the release hash in its manifest.
on:
  push:
    branches:
      - main
    paths:
      - components/deb/bootc-base/manifest.kdl
      - components/deb/bootc-base/build-tools.sh
      - .github/pins.py
      - .github/workflows/tools.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tools:
    name: build tools ${{ matrix.family }}
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      # The provenance attestation binds each tarball to its workflow run.
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - family: debian
            base: docker.io/library/debian:forky
          - family: ubuntu
            base: docker.io/library/ubuntu:26.04
    env:
      FAMILY: ${{ matrix.family }}
      BASE: ${{ matrix.base }}
      COMPONENT: components/deb/bootc-base
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      # The released fetch helper applies the same source checks as an image
      # build.
      - name: Take the released tool's build helpers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          dir="${RUNNER_TEMP}/tect"
          mkdir -p "$dir"
          gh release download --repo tectonic-os/tectonic --dir "$dir" \
            --pattern 'tect-v*-x86_64-linux-musl.tar.gz*'
          (cd "$dir" && printf '%s  %s\n' "$(cat ./*.sha256)" ./*.tar.gz \
            | sha256sum --check --status)
          tar -xzf "$dir"/*.tar.gz -C "$dir"
          mkdir -p "${RUNNER_TEMP}/ctx/lib"
          cp "$dir"/assets/lib/*.sh "${RUNNER_TEMP}/ctx/lib/"
          cp components/deb/build-environment/lib/family.sh "${RUNNER_TEMP}/ctx/lib/"

      - name: Read the component's pins
        run: |
          set -euo pipefail
          python3 .github/pins.py "$COMPONENT" > "${RUNNER_TEMP}/pins.env"
          # The `bootc-tools-*` pins record this release, so the build omits them.
          grep -v '^ASSET_BOOTC_TOOLS_' "${RUNNER_TEMP}/pins.env" > "${RUNNER_TEMP}/build.env"
          # shellcheck disable=SC1091
          . "${RUNNER_TEMP}/build.env"
          version="bootc${ASSET_BOOTC_VERSION}-bootupd${ASSET_BOOTUPD_VERSION}"
          {
            echo "VERSION=${version}"
            echo "TAG=deb-bootc-tools-${version}"
            echo "TARBALL=deb-bootc-tools-${FAMILY}-${version}.tar.zst"
          } >> "$GITHUB_ENV"

      # A published tarball is never replaced, because a manifest records its
      # hash.
      - name: Check whether this family is already published
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --json assets --jq '.assets[].name' 2>/dev/null \
            | grep -Fxq "$TARBALL"; then
              echo "PUBLISH=false" >> "$GITHUB_ENV"
              echo "::notice::${TARBALL} already exists; leaving it unchanged"
          else
              echo "PUBLISH=true" >> "$GITHUB_ENV"
          fi

      # The tarball is made inside the container, so it records root as the
      # owner. Rootless podman maps root to the runner UID outside it.
      - name: Compile bootc and bootupd on this family's base
        if: env.PUBLISH == 'true'
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/out"
          podman run --rm \
            -v "${PWD}:/src:ro" \
            -v "${RUNNER_TEMP}/ctx/lib:/ctx/lib" \
            -v "${RUNNER_TEMP}/out:/out" \
            --env-file "${RUNNER_TEMP}/build.env" \
            -e "TARBALL=${TARBALL}" \
            -e "COMPONENT=${COMPONENT}" \
            "$BASE" bash -euxo pipefail -c '
              # The build environment sets the archive policy of an image build.
              source /ctx/lib/family.sh
              bash /src/components/deb/build-environment/component.sh
              # curl and ca-certificates fetch the pinned sources. zstd packs the tarball.
              install_packages curl ca-certificates zstd
              DESTDIR=/stage bash "/src/${COMPONENT}/build-tools.sh"
              tar --use-compress-program="zstd -19 -T0" -C /stage -cf "/out/${TARBALL}" .
            '

      # The attestation lets the user verify where the tarball was built.
      - name: Attest the tarball
        if: env.PUBLISH == 'true'
        uses: actions/attest-build-provenance@bd77c077858b8d561b7a36cbe48ef4cc642ca39d
        with:
          subject-path: ${{ runner.temp }}/out/${{ env.TARBALL }}

      - name: Publish the tarball and say what to pin it at
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "${RUNNER_TEMP}/out"
          # Both family jobs create the same tag, so the later create fails.
          gh release create "$TAG" --title "$TAG" --notes \
            "The bootc and bootupd trees \`deb/bootc-base\` installs, compiled from its pins." \
            || true
          gh release upload "$TAG" "$TARBALL"
          echo "::notice::${COMPONENT}/manifest.kdl: bootc-tools-${FAMILY} is version \"${VERSION}\" sha256 \"$(sha256sum "$TARBALL" | cut -d' ' -f1)\""
