# The `/home`, `/root`, `/srv`, `/mnt` and `/usr/local` links point here.
# The tool's /var pass removes each /var directory that no tmpfiles.d file
# declares. A derived container build runs no tmpfiles, so the links would
# dangle in its `RUN` steps.
d /var/home 0755 root root -
d /var/roothome 0700 root root -
d /var/srv 0755 root root -
d /var/mnt 0755 root root -
d /var/usrlocal 0755 root root -
