# `debian:*` ships an `/etc/resolv.conf` that names 1.1.1.1. The
# systemd-resolved `L!` rule never replaces an existing file, so this `L+`
# points the path at the resolved stub. The build backend bind-mounts
# `/etc/resolv.conf` into every `RUN`, so only a boot-time rule can replace it.
L+ /etc/resolv.conf - - - - ../run/systemd/resolve/stub-resolv.conf
