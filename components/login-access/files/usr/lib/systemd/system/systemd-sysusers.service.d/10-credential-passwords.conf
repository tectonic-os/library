# This is what makes a machine with no installer reachable. The hypervisor
# hands it an account. Nothing secret is in the image.
#
# `systemd-sysusers` already imports `sysusers.*`. A
# `-smbios type=11,value=io.systemd.credential:sysusers.extra=u <name> - ...`
# credential creates the account with the uid, gecos, home and shell it
# names. All four fields arrive intact. What it does not import is a
# password for anyone but root. The stock unit names
# `passwd.hashed-password.root` and its two siblings, and stops there. The
# account it just made stays `!*`. It cannot log in. Root is no way round
# that. Debian ships `root:*`, and `systemd-firstboot` declines to
# overwrite a password it reads as already set. `systemd-firstboot` does
# not run at all here, because `ConditionFirstBoot=yes` never holds on a
# bootc deployment.
#
# So this widens the import to any user. That is an ability the image
# offers. The hash is supplied per boot by whoever starts the machine, and
# nothing about it ships. Weigh it that way. An image carrying this accepts
# an account from whoever controls its firmware or its hypervisor. On bare
# metal that is a person who already owns the machine. In a guest it is an
# operator who already owns the disk.
# Hashed only. `passwd.plaintext-password.*` is the sibling glob, and it is
# deliberately not here. Nothing in this project needs to hand a machine a
# password in the clear. A credential that can be read out of a
# hypervisor's config is worth less trouble as a hash.
[Service]
ImportCredential=passwd.hashed-password.*
