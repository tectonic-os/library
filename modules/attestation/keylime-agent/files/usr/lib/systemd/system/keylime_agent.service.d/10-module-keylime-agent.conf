# Operators skip the agent on machines without a TPM to avoid a restart loop.
# They accept the resource-manager node or the raw node used with tpm2-abrmd.
# Operators prefix both conditions with `|` so systemd accepts either node.
[Unit]
ConditionPathExistsGlob=|/dev/tpmrm[0-9]*
ConditionPathExistsGlob=|/dev/tpm[0-9]*
