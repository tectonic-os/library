# bootc's own reference conf asks for `add_dracutmodules+=" ostree bootc "`,
# and asking for `ostree` here is what killed the base deleted on 2026-08-30:
# Debian's ostree package ships no dracut module, dracut logs `Module 'ostree'
# cannot be found`, **exits 0**, and writes an initramfs carrying neither.
# Name `bootc` alone — its module comes from bootc's own `make install` — and
# check the result by what is inside it, never by `test -s`.
#
# bootcrew's Debian image also sets `systemdsystemunitdir` and
# `systemdsystemconfdir` here, which the 51bootc module reads. Measured on
# dracut 112 and deliberately not copied: with those two lines removed the
# module still installs all three of its paths, so on this dracut they buy
# nothing.
hostonly=no
reproducible=yes
compress=zstd
add_dracutmodules+=" bootc "
