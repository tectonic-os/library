# The composefs backend, which is what lets `bootc install` reach systemd-boot
# on a base that has no `bootupd` — Debian packages none. `enabled = yes`, not
# `verity`: the arms that appeared to need `verity` were also overwriting a
# base file and silently dropping the read-only sysroot below.
[composefs]
enabled = yes

[sysroot]
readonly = true
