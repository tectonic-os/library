# `ConditionFirstBoot=yes` never holds on a bootc deployment, so the unit that
# makes sshd's host keys never runs, so `ssh.service` fails its
# `ExecStartPre=/usr/sbin/sshd -t` with "no hostkeys available" and hits its
# start limit. The image is right to carry no host keys — `finalize.sh` deletes
# them so that every machine generates its own — and the unit is neither
# missing nor unenabled: the package ships
# `/etc/systemd/system/ssh.service.wants/sshd-keygen.service` and orders it
# `Before=ssh.service`.
#
# **The condition is measured, with a control in the same boot, 2026-09-02.**
# `systemd-firstboot.service` and `systemd-sysusers.service` are both statically
# enabled in `/usr/lib/systemd/system/sysinit.target.wants/`. `sysusers`, whose
# conditions are `ConditionNeedsUpdate=|/etc`, runs. `firstboot`, whose
# condition is `ConditionFirstBoot=yes`, does not — no start, no skip, nothing.
# The two differ in that one condition. Do not be misled by systemd logging
# `Initializing machine ID from random generator` in the real root: it
# generates an id without declaring a first boot.
#
# Resetting the condition costs nothing, because `ssh-keygen -A` writes only
# the keys that are absent — a second boot of the same machine runs it again
# and finds nothing to do.
[Unit]
ConditionFirstBoot=
