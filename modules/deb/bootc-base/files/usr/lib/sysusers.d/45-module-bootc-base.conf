# Ubuntu's `openssh-client` creates the `_ssh` group imperatively in a postinst
# and ships no sysusers.d rule for it, so `bootc container lint` reports a group
# nothing declares. Declaring it is the fix rather than deleting it:
# `/usr/bin/ssh-agent` is setgid `_ssh` and would be setgid a gid that no longer
# resolves. `debian:forky`'s `openssh-client` creates no such group, so on
# Debian this line makes one nothing uses — a gid, and honest about where it
# came from, which deleting the file on one family would not be.
g _ssh - -
