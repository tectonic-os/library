# The dpkg admindir lives under /usr so `bootc upgrade` carries it; this puts
# it back where everything looks for it. A link and not `--admindir`, because
# `dpkg-query` reads no configuration file at all and apt, `py3clean`, `ucf`
# and maintainer scripts compile the default path in. `L+` and not `L`, so the
# link replaces whatever a package left there. `/var/lib` is systemd's own
# `var.conf` line and is not repeated here: tmpfiles creates no parent for an
# `L+`, but it does order every entry by path, so the parent is made first.
L+ /var/lib/dpkg - - - - /usr/lib/sysimage/dpkg
