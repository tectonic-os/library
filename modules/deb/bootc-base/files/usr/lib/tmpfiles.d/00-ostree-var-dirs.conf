# What the ostree-style toplevel symlinks point at. /var starts empty on an
# installed system, so without these `/root`, `/home` and `/usr/local` resolve
# to nothing on a booted machine.
#
# They have to be declared *here* rather than left to the tool's own /var pass,
# which would emit the same rules: that pass records a directory and then
# removes it, so all five links would dangle in the shipped image. A booted
# machine self-heals, a derived container build never runs tmpfiles — measured,
# `cd /root` fails (and /root is HOME for every derived RUN) and `mkdir -p
# /usr/local/bin` fails with `cannot create directory '/usr/local': File
# exists`. A path another tmpfiles.d file already declares is skipped by the
# pass and left on disk, which is exactly how Fedora gets this for free:
# rpm-ostree's own autovar rules declare /var/home, /var/roothome, /var/srv
# and /var/mnt, so nothing there ever noticed.
d /var/home 0755 root root -
d /var/roothome 0700 root root -
d /var/srv 0755 root root -
d /var/mnt 0755 root root -
d /var/usrlocal 0755 root root -
