# `debian:*` ships an `/etc/resolv.conf` hardcoding Cloudflare, and this module
# installs `systemd-resolved`, whose own tmpfiles line is `L!` — create at boot
# *if absent*, so as not to clobber an admin's file. The base's file is never
# absent, so left alone the resolver stub this image installs is never reached
# and every machine asks 1.1.1.1 directly. `L+` and not `L`, for the same
# reason `00-dpkg-admindir.conf` uses it: the link has to replace what the
# container image left there. The line is `hardening/network-policy`'s
# verbatim, which does this for Fedora.
#
# It cannot be a file in this overlay instead. `/etc/resolv.conf` is one of the
# three paths the build backend bind-mounts into every `RUN`, so nothing inside
# a layer can write or delete it — measured, `rm` answers `Device or resource
# busy` and the image keeps the base's copy.
L+ /etc/resolv.conf - - - - ../run/systemd/resolve/stub-resolv.conf
