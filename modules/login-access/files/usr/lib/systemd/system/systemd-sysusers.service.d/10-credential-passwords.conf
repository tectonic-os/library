# What makes a machine with no installer reachable: the hypervisor hands it an
# account, and nothing secret is in the image.
#
# `systemd-sysusers` already imports `sysusers.*`, so a
# `-smbios type=11,value=io.systemd.credential:sysusers.extra=u <name> - ...`
# credential creates the account with the uid, gecos, home and shell it names —
# measured 2026-09-02, all four fields arrive intact. What it does *not* import
# is a password for anyone but root: the stock unit names
# `passwd.hashed-password.root` and its two siblings and stops there, so the
# account it just made stays `!*` and cannot log in. Root is no way round that,
# because Debian ships `root:*` and `systemd-firstboot` — which does not run at
# all here, `ConditionFirstBoot=yes` never holding on a bootc deployment —
# declines to overwrite a password it reads as already set.
#
# So this widens the import to any user, which is an *ability* and not a key:
# the hash is supplied per boot by whoever starts the machine and nothing about
# it ships. Weigh it as such — an image carrying this accepts an account from
# whoever controls its firmware or its hypervisor, which on bare metal is a
# person who already owns the machine, and in a guest is an operator who
# already owns the disk.
# Hashed only. `passwd.plaintext-password.*` is the sibling glob and is
# deliberately not here: nothing in this project needs to hand a machine a
# password in the clear, and a credential that can be read out of a hypervisor's
# config is worth less trouble as a hash.
[Service]
ImportCredential=passwd.hashed-password.*
