# The three `20-bootc-base`, `22-bootc-generic` and `30-bootc-standard` files
# `centos-bootc:stream10` ships, as one. `ostree` names a dracut module EL's
# ostree package really carries, unlike the deb family's; `bootc` names the one
# the bootc package ships. `finalize.sh` checks the result by what is inside it.
hostonly=no
# dracut cannot set security.selinux xattrs at build time.
export DRACUT_NO_XATTR=1
compress=zstd
add_dracutmodules+=" kernel-modules dracut-systemd systemd-initrd base ostree bootc "
add_dracutmodules+=" virtiofs lvm crypt "
