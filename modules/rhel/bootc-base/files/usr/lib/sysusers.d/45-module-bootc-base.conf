# Two entries EL creates from a scriptlet and declares in no sysusers.d file,
# which `bootc container lint` reports against /etc/passwd. `centos-bootc`
# answers this by moving every user to /usr/lib/passwd through nss-altfiles;
# declaring them is the smaller half of that and is what the deb base does.
#
# Both ids are pinned to what the image already baked, so a machine that
# re-creates them from this file agrees with the files on its disk.
u systemd-oom 999 "systemd Userspace OOM Killer"
g utempter 35
